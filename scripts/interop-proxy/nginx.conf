# nginx in front of net/httpstream, as scripts/interop-proxy.sh runs it.
# UPSTREAM is replaced by the server's address before the file is copied in.
#
# The upstream block keeps idle connections to the server (keepalive), which
# needs HTTP/1.1 and an empty Connection header on the proxied request:
# without them nginx opens a connection per request and the reuse cases test
# nothing. Request bodies are not buffered, so a chunked request reaches the
# server chunked.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;

  upstream sluice {
    server UPSTREAM;
    keepalive 8;
  }

  server {
    listen 127.0.0.1:18081;

    location / {
      proxy_pass http://sluice;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
    }
  }
}
