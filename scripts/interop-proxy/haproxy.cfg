# HAProxy in front of net/httpstream, as scripts/interop-proxy.sh runs it.
# UPSTREAM is replaced by the server's address before the file is copied in.
#
# Two frontends: one reaches the server over HTTP/1.1, the other over HTTP/2
# in clear text (proto h2). Both backends health-check it the way HAProxy
# deployments often do, with OPTIONS *, every 200 ms, one failure enough to
# mark it down: a server that mishandled the asterisk form would answer the
# script's requests with HAProxy's 503.
global
  log stderr format raw local0 warning

defaults
  mode http
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  http-reuse always

frontend h1
  bind 127.0.0.1:18082
  default_backend sluice_h1

frontend h2
  bind 127.0.0.1:18083
  default_backend sluice_h2

backend sluice_h1
  option httpchk
  http-check send meth OPTIONS uri * ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  server s1 UPSTREAM check inter 200ms fall 1 rise 1

backend sluice_h2
  option httpchk
  http-check send meth OPTIONS uri * ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  server s1 UPSTREAM proto h2 check inter 200ms fall 1 rise 1
