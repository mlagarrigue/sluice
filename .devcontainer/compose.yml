# A fixed project name, rather than one derived from the folder the
# repository was cloned into.
name: sluice

services:
  dev:
    # The image copies nothing from the repository: this folder is the whole
    # build context, and the workspace arrives by the mount below.
    build:
      context: .
      dockerfile: Dockerfile
    image: sluice-dev:go1.26
    container_name: sluice-dev
    volumes:
      - ..:/workspaces/sluice:cached
    command: sleep infinity
    # A test killed by its timeout leaves its children to process 1; sleep
    # never reaps them and they pile up as zombies (178 after one review,
    # 2026-10-30). Docker's init reaps them.
    init: true
    # The integration suite reads these; without them it skips, cleanly.
    environment:
      SLUICE_PG: postgres:5432
      SLUICE_PG_USER: sluice
      SLUICE_PG_DB: sluice
      SLUICE_PG_PASSWORD: sluicepass
      SLUICE_REDIS: valkey:6379
      SLUICE_NATS: nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started

  # The same server CI runs, initialised by the same file.
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: sluice-postgres
    # A test server: its data lives in memory and goes with the container,
    # and durability is off. The integration database weighs 39 MB after a
    # full run; the tmpfs counts against mem_limit.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "wal_level=logical"]
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The Redis server the CI redis job runs, for database/redis. Nothing is
  # written to disk: the data goes with the container.
  valkey:
    image: valkey/valkey:8.1@sha256:5032c4dd7abe08d6fd9382054608183e2bf1f7e3895ef619b8784698454325f7
    container_name: sluice-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The NATS server the CI nats job runs, JetStream on, for messaging/nats.
  # The image holds the server alone, no shell, so no health check: the
  # server listens within a second of its start, long before the dev
  # container opens. The TLS server the CI job also runs
  # is not here (CONTRIBUTING.md, "Integration tests").
  nats:
    image: nats:2.12@sha256:0764f1952d72e92e35ad8b152da0f9652a49cb1186b6445fdd45131d81ad6d7e
    container_name: sluice-nats
    command: ["-js"]
