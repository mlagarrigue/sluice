version: 2
updates:
  # The production dependencies (golang.org/x/crypto, with the x/sys it
  # brings, and golang.org/x/text). A bump that raises the go directive past the oldest version CI
  # builds is caught by TestGoModVersionMatchesTheOldestCIBuild, not merged
  # blindly.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  # quic-go, interop/'s one requirement, which the study's three modules take
  # from it: TestSharedDependenciesAgreeAcrossModules (nodeps_test.go) fails
  # a bump that moves one go.mod and not the four, so this entry allows
  # quic-go alone and groups it by name across the four directories — one
  # pull request raises them together. It still fails
  # TestNestedReadmesPinWhatTheirGoModRequires (docs_index_test.go): the
  # version table of interop/README.md is prose Dependabot does not touch.
  # The pull request is the signal; the bump lands as a commit on main that
  # raises the four go.mod and the table, and the pull request is closed.
  # A bump that breaks the handshake fails the interop-quic job, which is
  # the point of running it.
  - package-ecosystem: gomod
    directories: ["/interop", "/comparison/sluice", "/comparison/loadgen", "/comparison/go-nethttp"]
    schedule:
      interval: weekly
    allow:
      - dependency-name: "github.com/quic-go/quic-go"
    groups:
      quic-go:
        patterns: ["github.com/quic-go/quic-go"]
        group-by: dependency-name
    commit-message:
      prefix: "build"
  # benchmarks/ pins the competitors at the versions the study compares
  # (pgx, which the comparison modules follow): a version bump would move
  # what is measured, so version updates are off (a limit of zero). Security
  # updates, enabled on the repository, still open a pull request when an
  # advisory names a module it requires.
  - package-ecosystem: gomod
    directories: ["/benchmarks"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  # The Node and Rust contenders' packages, frozen for the same reason:
  # security updates only.
  - package-ecosystem: npm
    directories: ["/comparison/node-express"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  - package-ecosystem: cargo
    directories: ["/comparison/rust-axum"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  - package-ecosystem: pip
    directories: ["/comparison/python-fastapi"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  - package-ecosystem: nuget
    directories: ["/comparison/dotnet-minimal"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  - package-ecosystem: maven
    directories: ["/comparison/java-spring"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  # The base images are pinned by digest (TestDockerImagesArePinned); these
  # entries move the digests: the interop endpoint's, the devcontainer's and
  # the study's images.
  - package-ecosystem: docker
    directories: ["/interop", "/.devcontainer", "/comparison/sluice", "/comparison/loadgen", "/comparison/go-nethttp", "/comparison/node-express", "/comparison/rust-axum", "/comparison/python-fastapi", "/comparison/java-spring", "/comparison/dotnet-minimal", "/comparison/chain/scc"]
    schedule:
      interval: weekly
    # The golang image follows the floor go.mod declares; raising it is the
    # decision TestGoModVersionMatchesTheOldestCIBuild guards, not a bump.
    # Within 1.26 the digest still moves.
    # The node image is the study's runtime, the latest LTS frozen for a
    # campaign (study §2.5: Node 24): a major is a decision of the study, not
    # a bump, and an odd major (25) is never an LTS. Within 24 the digest
    # still moves.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Python likewise (study §2.5: 3.14), whose releases move the minor.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Java likewise (study §2.5: Java 25, the LTS): the JDK and JRE images'
      # tags carry Java's major. The Maven image's carries Maven's (3), and
      # Java's only as a suffix, which Dependabot moves as a lesser update:
      # its tag stays, only its digest moves.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: bellsoft/liberica-openjre-debian
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # .NET likewise (study §2.5: .NET 10, the LTS): the SDK and runtime
      # images' tags carry the major.
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build"
  # The CodeQL sub-actions (init, autobuild, analyze) are one release pinned
  # at one SHA: bumped one by one, each pull request mixes two versions and
  # fails the CodeQL workflow. Grouped, they move in one pull request.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
    commit-message:
      prefix: "ci"
