version: 2
updates:
  # The production dependencies (golang.org/x/crypto, with the x/sys it
  # brings, and golang.org/x/text). A bump that raises the go directive past the oldest version CI
  # builds is caught by TestGoModVersionMatchesTheOldestCIBuild, not merged
  # blindly.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  # The interop module pins quic-go (interop/go.mod); a bump that breaks the
  # handshake fails the interop-quic job, which is the point of running it.
  - package-ecosystem: gomod
    directory: "/interop"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  # The comparison modules pin the competitors at the versions the study
  # compares: a version bump would move what is measured, so version updates
  # are off (a limit of zero). Security updates, enabled on the repository,
  # still open a pull request when an advisory names a module they require.
  - package-ecosystem: gomod
    directories: ["/benchmarks", "/comparison/sluice", "/comparison/loadgen"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
  # The base images are pinned by digest (TestDockerImagesArePinned); these
  # entries move the digests, the interop endpoint's and the devcontainer's.
  - package-ecosystem: docker
    directories: ["/interop", "/.devcontainer"]
    schedule:
      interval: weekly
    # The golang image follows the floor go.mod declares; raising it is the
    # decision TestGoModVersionMatchesTheOldestCIBuild guards, not a bump.
    # Within 1.26 the digest still moves.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
