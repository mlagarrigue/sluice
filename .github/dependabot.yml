version: 2
updates:
  # The production dependencies (golang.org/x/crypto, with the x/sys it
  # brings). A bump that raises the go directive past the oldest version CI
  # builds is caught by TestGoModVersionMatchesTheOldestCIBuild, not merged
  # blindly.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  # The interop module pins quic-go (interop/go.mod); a bump that breaks the
  # handshake fails the interop-quic job, which is the point of running it.
  - package-ecosystem: gomod
    directory: "/interop"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
