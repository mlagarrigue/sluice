# The external addresses the documents and the Go comments cite, fetched
# weekly (scripts/check-links.sh). Not on every push: a site's bad hour
# would fail a change that touched no link, and a page that disappears does
# so on its own schedule, not on ours.
name: Links

on:
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch every external address
        run: scripts/check-links.sh
