name: Fuzz

on:
  schedule:
    # Nightly. The seed corpora already run on every push as ordinary tests;
    # this is the part that searches beyond them, which no PR run has time for.
    # Thirty seconds a target on weekdays; on Sunday five minutes, the night
    # that goes further (the first cron's days exclude it).
    - cron: '43 2 * * 1-6'
    - cron: '43 2 * * 0'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Time per fuzz target (go test -fuzztime); empty: scripts/fuzz.yaml'
        default: ''

permissions:
  contents: read

jobs:
  # Targets are discovered, not listed by hand: a fuzz target added without
  # touching this file is fuzzed the next night rather than never.
  # The study's module, comparison/sluice, is listed beside the root's: its
  # packages are outside the root's ./... and carry a target of their own.
  discover:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
      - id: list
        run: |
          {
            scripts/fuzz.sh --list | cut -d' ' -f1 | sort -u | jq -R '{module: ".", package: .}'
            MODULE=comparison/sluice scripts/fuzz.sh --list | cut -d' ' -f1 | sort -u |
              jq -R '{module: "comparison/sluice", package: .}'
          } | jq -sc . > targets.json
          echo "targets=$(cat targets.json)" >> "$GITHUB_OUTPUT"
          cat targets.json

  # One job per package so the largest corpus (postgres) does not serialise
  # behind the others, and one package's finding does not cancel the rest.
  # Sunday's five minutes a target take postgres's thirty-six past three
  # hours, hence the longer bound that night.
  fuzz:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.schedule == '43 2 * * 0' && 240 || 60 }}
    env:
      GOWORK: off
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'

      # The corpus a night grows lives in the build cache's fuzz directory,
      # not in testdata/: kept from one night to the next, the coverage
      # accumulates instead of starting from the seeds every time. A key per
      # run, restored by prefix, so each night saves what it reached and the
      # next one starts from the latest.
      - id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.package }}-
      - name: Corpus at the start
        env:
          DIR: ${{ steps.corpus.outputs.dir }}
        run: |
          echo "corpus at the start: $(find "$DIR" -type f 2>/dev/null | wc -l) inputs"

      # scripts/fuzz.yaml sets the time per target and the limits, here as
      # locally; only Sunday's run and a dispatch ask for another time.
      - name: Fuzz every target in ${{ matrix.package }}
        env:
          FUZZTIME: ${{ inputs.fuzztime || (github.event.schedule == '43 2 * * 0' && '5m') || '' }}
          FUZZ_OUT: fuzz-failures
          MODULE: ${{ matrix.module }}
          PKG: ${{ matrix.package }}
        run: scripts/fuzz.sh --wait 10 "$PKG"

      # The reproducers only — the files the run added under testdata/fuzz.
      # Committing one turns it into a regression test that runs on every push.
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: fuzz-failures/
          if-no-files-found: ignore
          # Artifacts of a public repository are public, and a crashing input
          # is a reproducer: a week to collect it, not the default ninety days.
          retention-days: 7
