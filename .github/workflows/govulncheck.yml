name: Vulnerability check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The standard library is the only dependency, but it does get advisories.
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # Nothing to cache in a zero-dependency project, and no go.sum to key on.
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
