name: Vulnerability check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The standard library is the only dependency, but it does get advisories.
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
