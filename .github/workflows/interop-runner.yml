# The public QUIC Interop Runner, sluice against every implementation in the
# runner's list, one job per peer and direction: 31 at the pinned revision,
# some eleven runner-hours, under forty-five minutes of wall clock. Weekly,
# and by hand for one peer or all of them; far beyond what a push should
# wait for. Each job's table is in its log and the runner's logs of every
# case (captures, keys, each side's output) are its artifact; the aggregate
# job joins the tables into one, peer by case, as the interop-matrix
# artifact and the run's summary.
name: Interop runner

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      peer:
        description: implementation to cross with (a name from the runner's list), or all
        default: all
      tests:
        description: comma-separated cases; empty means every case
        default: ''
      image:
        description: published image to run instead of building the working tree (ghcr.io/mlagarrigue/sluice-interop:latest)
        default: ''
  workflow_call:
    inputs:
      peer:
        type: string
        default: all
      tests:
        type: string
        default: ''
      image:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # The pairs come from the runner's own list at the pinned revision, so a
  # peer it adds or drops is crossed or not without editing this file, and
  # each side is played only where the peer's role allows it.
  pairs:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: list
        env:
          PEER: ${{ inputs.peer || 'all' }}
        run: |
          include=$(scripts/interop-runner.sh --matrix "$PEER")
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "$include" | jq -r '.[] | "\(.peer) \(.side)"'

  interop:
    needs: pairs
    name: ${{ matrix.peer }} (sluice ${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pairs.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The runner's compose file names its interfaces, which needs a Docker
      # Engine 28.1 or later; the hosted runner ships an older one.
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # The runner decrypts the captures with tshark and needs a newer one
      # than Ubuntu ships; this is the source its own workflow installs from.
      - name: Install tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tshark
          tshark --version | head -n1
      - name: Enable IPv6 filtering for the simulated network
        run: sudo modprobe ip6table_filter
      # The inputs reach the script through the environment, never pasted
      # into the command: a value is then data, whatever it holds.
      - name: Run the interop runner
        env:
          RUNNER_DIR: ${{ runner.temp }}/quic-interop-runner
          PEER: ${{ matrix.peer }}
          SIDE: ${{ matrix.side }}
          IN_TESTS: ${{ inputs.tests }}
          IN_IMAGE: ${{ inputs.image }}
        run: |
          set -o pipefail
          if [ -n "$IN_TESTS" ]; then export TESTS="$IN_TESTS"; fi
          if [ -n "$IN_IMAGE" ]; then export IMAGE="$IN_IMAGE"; fi
          # Both streams into the artifact: the runner's debug output and any
          # traceback go to stderr, and the job log is cut long before a
          # full pass ends.
          scripts/interop-runner.sh "$PEER" 2>&1 | tee "$RUNNER_DIR-output.txt"
      - name: Keep the runner's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ matrix.peer }}-${{ matrix.side }}
          path: |
            ${{ runner.temp }}/quic-interop-runner/logs
            ${{ runner.temp }}/quic-interop-runner/results_*.json
            ${{ runner.temp }}/quic-interop-runner-output.txt
          if-no-files-found: ignore
          # Artifacts of a public repository are public, and these carry
          # packet captures with their TLS key logs: a week to read them.
          retention-days: 7

  # One table for the whole pass, peer by case, each cell the runner's word
  # for sluice as server and as client; a job that produced no results (a
  # timeout, a broken image) shows as a dash rather than vanishing.
  aggregate:
    needs: interop
    if: always() && needs.interop.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: interop-*
          path: passes
      - name: Join the tables
        run: |
          mkdir matrix
          find passes -name 'results_*.json' ! -name 'results_none.json' -exec jq -c '
            input_filename as $f
            | (.results[0] // [])[] as $r
            | { server: .servers[0], client: .clients[0], name: $r.name, result: $r.result }
          ' {} + > matrix/cases.jsonl || true
          jq -rs '
            map(if .server == "sluice" then {peer: .client, side: "server"} + . else {peer: .server, side: "client"} + . end)
            | (map(.name) | unique) as $cases
            | group_by(.peer)
            | "| peer | " + ($cases | join(" | ")) + " |",
              "|---" + ($cases | map("|---") | join("")) + "|",
              (.[] | . as $rows
                | ($rows | map({key: "\(.side)/\(.name)", value: .result[0:1]}) | from_entries) as $m
                | "| \($rows[0].peer) | " + ($cases | map("\($m["server/" + .] // "-")/\($m["client/" + .] // "-")") | join(" | ")) + " |")
          ' matrix/cases.jsonl > matrix/matrix.md
          {
            echo "Each cell: sluice as server / sluice as client; s succeeded, f failed, u unsupported, - not run."
            echo
            cat matrix/matrix.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-matrix
          path: matrix/
          retention-days: 90
