name: Release

# release-please reads the conventional commits on main, keeps a release
# pull request up to date with the next version and its CHANGELOG, and tags
# the release when that pull request is merged. In v0 a `feat!` bumps the
# minor and a `feat` the patch (release-please-config.json); v1.0.0 is
# tagged by hand, once.
#
# A tag pushed with the workflow's own token starts no other workflow, so
# the interop image is built from here, by call, when a release was cut.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  interop-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/interop-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
