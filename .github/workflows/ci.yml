name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be re-triggered by hand without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_LATEST: 'stable'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: the minimum go.mod promises, and
        # whatever is current. Everything between is interpolation.
        #
        # Linux only. The core is pure computation over slices with no syscalls,
        # no filesystem and no path handling, so there is nothing for another OS
        # to break. Add macOS and Windows back when the HTTP and database layers
        # land and that stops being true.
        go: ['1.24', 'stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # No dependencies means nothing to cache, and no go.sum to key on.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The per-stage budget is a timing assertion, so it is skipped under
      # -race: the detector instruments every memory access and the measurement
      # would report the instrumentation rather than the code.
      - name: Performance budget
        run: go test -run TestStageBudget ./internal/bench/

      - name: Build
        run: go build ./...

  # Zero production dependencies is a project rule, not an aspiration. Checked
  # two ways: go.mod must declare nothing, and no non-test file may import
  # anything outside the standard library.
  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_LATEST }}
          cache: false

      - name: go.mod declares no dependencies
        run: |
          if grep -qE '^\s*require' go.mod; then
            echo "::error file=go.mod::go.mod declares dependencies; sluice is stdlib-only" >&2
            exit 1
          fi

      - name: No non-stdlib imports
        run: |
          module=$(go list -m)
          external=$(go list -deps ./... \
            | grep -E '^[^/]+\.[^/]+/' \
            | grep -v "^${module}\(/\|$\)" || true)
          if [ -n "$external" ]; then
            echo "::error::non-stdlib packages in the dependency graph:" >&2
            echo "$external" >&2
            exit 1
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_LATEST }}
          cache: false

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted=$(gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofumpt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_LATEST }}
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_LATEST }}
          cache: false

      # Runs the harness to catch compile breakage and crashes. CI timings are
      # too noisy to gate on: the reference figures come from a controlled run,
      # recorded in docs/BENCHMARK-STEP-0.md.
      - name: Benchmarks (smoke)
        run: go test -run=XXX -bench=. -benchtime=10x ./internal/bench/
