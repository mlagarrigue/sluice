# The interop endpoint's public image, ghcr.io/mlagarrigue/sluice-interop,
# which the Interop runner workflow pulls (its image input) to cross a
# release rather than the working tree. Built from a release tag only,
# never from a commit of main: the runner tests the state the release
# notes and docs/guide/limits.md describe. `latest` moves with each
# release; the version tag stays. The Release workflow calls this one with
# the tag it just cut (its token's tag push starts nothing); a tag pushed by
# hand starts it directly. The dispatch form rebuilds a tag whose image was
# lost or whose base image moved; given a branch, it refuses.
name: Interop image

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: release tag to build
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One run per tag. A release now reaches this file twice — release.yml calls
# it when release-please cuts the release, and the tag that push leaves may
# raise the trigger above on its own — and two runs would build and push the
# same image. The later one wins, since it is no further along than the one
# it replaces: the build is the same bytes either way.
concurrency:
  group: interop-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  interop-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require a release tag
        if: inputs.tag == '' && github.ref_type != 'tag'
        run: |
          echo "::error::the interop image is built from a tag, not from ${{ github.ref }}"
          exit 1
      # The call form trusted whatever tag it was handed, and `:latest` moves
      # with every build: a caller asking for a tag that is not a release
      # would take `:latest` off the newest one. A caller that asks for it is
      # a bug, so this fails rather than skips.
      - name: Require the tag to name a release
        if: inputs.tag != '' && !startsWith(inputs.tag, 'v')
        run: |
          echo "::error::the interop image is built from a release tag; '${{ inputs.tag }}' is not one"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      # The online runner wants linux/amd64; arm64 serves a local run on an
      # Apple or Graviton machine. The base image ships both.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: interop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mlagarrigue/sluice-interop:${{ env.TAG }}
            ghcr.io/mlagarrigue/sluice-interop:latest
          labels: |
            org.opencontainers.image.source=https://github.com/mlagarrigue/sluice
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.description=sluice's endpoint for the QUIC Interop Runner
