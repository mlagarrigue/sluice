name: Bug
description: Something behaves differently from what is documented
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: >-
        Where the bug is: the commit scope, then the paths it covers. The
        last six are the repository around the library. If you are not
        sure, pick "other".
      options:
        - core — the root package (Stream, Batch, the operators)
        - join
        - window
        - parallel
        - distinct
        - postgres — database/postgres, database/postgres/pgtype, cmd/sluicegen
        - quic — net/quic, net/quic/udp
        - httpstream — net/httpstream
        - web — web, web/stream
        - gateway
        - diagnostics — diagnostics, probe, pushdown
        - bench — benchmarks, comparison, the measurements
        - docs — docs, README, CONTRIBUTING
        - ci — scripts, workflows, templates
        - devcontainer — .devcontainer
        - audit — the audit module
        - other — not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: >
        What you observed, and what the documentation led you to expect.
        The documentation starts at docs/README.md.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A failing test or a short program. Runnable code is worth more than a
        description.
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Module version or commit SHA, your Go version, your OS.
    validations:
      required: true

  - type: checkboxes
    id: invariant
    attributes:
      label: Does this break a stated guarantee?
      description: >
        The architecture lists the guarantees the library makes (reach it
        from docs/README.md, "Security — verifiable properties"). Tick any
        that apply.
      options:
        - label: Unbounded allocation where a bound was promised
        - label: A panic crossing a public boundary other than through Try
        - label: A goroutine or iterator leak
        - label: Resources not released on early stop
        - label: Silently wrong results
