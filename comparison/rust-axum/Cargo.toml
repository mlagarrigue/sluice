# The study's Rust contender: axum and sqlx, without grouping
# (comparison/README.md). One server, src/main.rs; what it shares with every
# contender without being measured on it is the library (src/lib.rs, the
# contract). The standard version is the release build, as the guides build
# it; the optimised version is the same code under the `optimised` profile
# below — the one change of its optimisation budget, listed with its source.
[package]
name = "study-rust-axum"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-full"] }

# The Rust Performance Book, "Build Configuration": link-time optimisation
# across every crate and one code generation unit, so that the optimiser sees
# the whole program. Not panic = "abort": a handler that panics would take
# the server down, where tokio otherwise ends that one task (§2.4: the
# optimised version stays acceptable in production).
[profile.optimised]
inherits = "release"
lto = "fat"
codegen-units = 1
